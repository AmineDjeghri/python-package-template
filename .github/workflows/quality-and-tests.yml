# =============================================================================
# Reusable Workflow — 👷 Quality Check & Tests
# =============================================================================
# Shared by: ci.yml, main-release.yml, dev-release.yml
# Runs pre-commit first, then tests sequentially.
# =============================================================================
name: "👷 Quality Check & Tests"

on:
  workflow_call:

permissions:
  contents: read

jobs:

  pre-commit:
    name: "🧹 Pre-commit"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python Dependencies
        uses: ./.github/actions/install-python-deps

      - name: Run Pre-commit
        id: pre_commit
        shell: bash
        run: |
          echo "::group::Pre-commit output"
          make pre-commit
          echo "::endgroup::"

      - name: Cleanup Artifacts
        if: always()
        uses: ./.github/actions/cleanup-artifacts

  tests:
    name: "Full software validation (test-all)"
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        # The 3.14 entry is pinned to the patch allowed by `requires-python`
        # (`<=3.14.8`): a bare "3.14" resolves to the newest patch, which the
        # project constraint rejects. Bump it when Renovate widens the bound.
        python-version: ["3.12", "3.13", "3.14.8"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    timeout-minutes: 5
    steps:
      - name: Check Out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Install Python Dependencies
        uses: ./.github/actions/install-python-deps

      - name: make test-all
        id: software
        shell: bash
        run: |
          echo "::group::Tests output"
          make test-all
          echo "::endgroup::"

      - name: Report comprehensive validation status
        if: always()
        env:
          SOFTWARE_RESULT: ${{ steps.software.outcome }}
        run: |
          if [ "$SOFTWARE_RESULT" = success ]; then
            echo 'All existing software suites passed. This template has no integration suite yet.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Full software validation is incomplete: make test-all failed or did not run. A focused/local-only pass is insufficient.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup Artifacts
        if: always()
        uses: ./.github/actions/cleanup-artifacts
