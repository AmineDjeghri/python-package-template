# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Ruff configuration lives in pyproject.toml.

# Avoid nodeenv's floating "latest", which can select unsupported alpha releases.
default_language_version:
  node: '24.22.2'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=3000']
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      #      - id: requirements-txt-fixer
      #        exclude: ^requirements/.*$
      - id: trailing-whitespace # This hook trims trailing whitespace
      - id: check-merge-conflict # Check for files that contain merge conflict strings
      - id: mixed-line-ending # Enforce Unix (LF) line endings
        args: [ --fix=lf ]
        exclude: \.(bat|ps1|reg)$ # These stay CRLF per .gitattributes
      - id: name-tests-test
        args: [ --pytest-test-first ]
        exclude: ^tests/unit/release/fixtures/release_command\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  -   repo: https://github.com/Yelp/detect-secrets
      rev: v1.5.0
      hooks:
        -   id: detect-secrets

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.11
    hooks:
      # Update the uv lockfile
      - id: uv-lock

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        language_version: '24.22.1'

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        types: [markdown]
        exclude: ^CHANGELOG\.md$

  - repo: local
    hooks:
      - id: mkdocs-build
        name: properdocs build --strict
        entry: make docs-build
        language: system
        files: ^(docs/|src/|backend/src/|frontend/src/|tests/README\.md$|scripts/gen_.*\.py$|properdocs\.yml$|[^/]+\.md$)
        pass_filenames: false

